name: Build and Push Lambda MicroVM Runner to ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: af-south-1
  ECR_REGISTRY: 323463077991.dkr.ecr.af-south-1.amazonaws.com
  # Lambda MicroVM runner (Path B) pushes to its own dedicated repo — never the
  # synapseai-codeapi API repo, whose immutable tags would collide with the
  # control-plane matrix sharing the same short SHA.
  ECR_REPOSITORY: synapseai-codeapi-microvm-runner

permissions:
  contents: read

concurrency:
  group: ecr-lambda-microvm-runner-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Runner Image
    # arm64 runner: the lambda-microvm-runner target must be a native arm64
    # image (Lambda MicroVMs builds on the AL2023 arm64 base). Matches the
    # runner used by the ci.yml validation job.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    outputs:
      image_tag: ${{ steps.sha.outputs.short }}
      image_uri: ${{ steps.uri.outputs.value }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ENVIRO_ECR_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ENVIRO_ECR_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Create native BuildKit builder
        run: |
          test "$(uname -m)" = "aarch64"
          docker buildx create \
            --name lambda-microvm-ecr \
            --driver docker-container \
            --use
          docker buildx inspect --bootstrap

      - name: Build and push via repo script
        # Delegates to scripts/build-lambda-microvm-artifact.sh so CI behaviour
        # (buildx flags, provenance/SBOM off, digest capture) stays identical
        # to a local run. The script's push stage re-tags and pushes; ECR login
        # inside the script is redundant after amazon-ecr-login but harmless.
        env:
          ECR_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.sha.outputs.short }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: scripts/build-lambda-microvm-artifact.sh build push

      - name: Record image URI
        id: uri
        env:
          ECR_URI: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ steps.sha.outputs.short }}
        run: |
          digest="$(sed -n '1p' .build-lambda-microvm/image-digest)"
          echo "value=${ECR_URI}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed tag:    ${ECR_URI}:${IMAGE_TAG}"
          echo "Immutable ref: ${ECR_URI}@${digest}"
          echo
          echo "  scripts/build-lambda-microvm-artifact.sh zip upload"
          echo "  then service/scripts/create-microvm-image.ts --artifact s3://..."

  # ---------------------------------------------------------------------------
  # Control-plane images (Path A self-hosted stack) -> Momentum ECR.
  #
  # One matrix job builds and pushes every image the depman spec references,
  # all tagged with the same short SHA so a deploy pins a coherent set:
  #   api, worker, file-server (service/Dockerfile targets)
  #   egress-gateway, tool-call-server (standalone Dockerfiles)
  #   sandbox-runner (api/Dockerfile target sandbox-runner: NsJail/directory-root
  #     mode — Momentum nodes have no /dev/kvm, so packages come from a PVC, not
  #     a baked image; the baked target is only for the KVM path we can't use)
  #   package-init (docker/Dockerfile.package-init: populates the packages PVC
  #     with the Python/Node/Bun runtime tree on deploy)
  #
  # Built for linux/amd64 (Momentum EKS x86 node groups). If the cluster moves
  # to Graviton/arm64, change CONTROL_PLANE_PLATFORM and the runner to match.
  #   egress-gateway, tool-call-server (standalone Dockerfiles)
  #   sandbox-runner (api/Dockerfile target sandbox-runner-baked: KVM mode with
  #     /pkgs baked in — this is the image that carries our fork's packages)
  #
  # Built for linux/amd64 (Momentum EKS x86 node groups). If the cluster moves
  # to Graviton/arm64, change CONTROL_PLANE_PLATFORM and the runner to match.
  build-control-plane:
    name: Build and Push Control-Plane Images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CONTROL_PLANE_PLATFORM: linux/amd64
    strategy:
      fail-fast: false
      matrix:
        include:
          - { repo: synapseai-codeapi,          dockerfile: service/Dockerfile,                 target: api }
          - { repo: synapseai-codeapi-worker,   dockerfile: service/Dockerfile,                 target: worker }
          - { repo: synapseai-codeapi-files,    dockerfile: service/Dockerfile,                 target: production }
          - { repo: synapseai-codeapi-toolcall, dockerfile: service/Dockerfile.tool-call-server, target: production }
          - { repo: synapseai-codeapi-egress,   dockerfile: service/Dockerfile.egress-gateway,   target: production }
          # NsJail mode (no /dev/kvm on Momentum nodes): directory-root runner.
          # Packages are delivered via the packages PVC + package-init Job below.
          - { repo: synapseai-codeapi-sandbox,  dockerfile: api/Dockerfile,                     target: sandbox-runner }
          # Populates the sandbox packages PVC (Python/Node/Bun) on deploy. Repo
          # must exist in ECR before this row can push.
          - { repo: synapseai-codeapi-package-init, dockerfile: docker/Dockerfile.package-init }
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ENVIRO_ECR_AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.ENVIRO_ECR_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set short SHA
        id: sha
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.repo }}
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/${{ matrix.repo }}:${{ steps.sha.outputs.short }}
        run: |
          # --target only when the matrix row names one (package-init is a
          # single-stage Dockerfile and has no target stage).
          TARGET_FLAG=()
          if [ -n "${{ matrix.target }}" ]; then
            TARGET_FLAG=(--target "${{ matrix.target }}")
          fi
          docker buildx build \
            --platform "$CONTROL_PLANE_PLATFORM" \
            "${TARGET_FLAG[@]}" \
            --provenance=false \
            --sbom=false \
            -f "${{ matrix.dockerfile }}" \
            -t "$IMAGE_URI" \
            --push \
            .
          echo "Pushed $IMAGE_URI"
